[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17.2"
image = "0.25.10"
tauri-plugin-os = "2"
tauri-plugin-camera-kessdev = "0.1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
